<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo Diamond — Ювелирная студия</title>
  <meta name="description" content="Создайте украшение мечты в онлайн-конструкторе или отправьте свой дизайн. Алматы." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nd-ink-900: #071630;
      --nd-ink-800: #0B2040;
      --nd-ink-600: #1E3149;
      --nd-ink-400: #5B81A1;
      --nd-ink-200: #c2d1de;
      --nd-paper-000: #ffffff;
      --nd-studio: radial-gradient(120% 90% at 50% 0%, #6A8EAC 0%, #40648A 45%, #1E3149 100%);
      --radius-sheet: 44px;
      --radius-pill: 999px;
      --shadow-sheet: 0 -8px 60px -12px rgba(7,22,48,.28);
      --font-display: 'Unbounded', system-ui, sans-serif;
      --font-body: 'Manrope', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-italic: 'Cormorant Garamond', 'Georgia', serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background: var(--nd-studio);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* ── Hero (studio backdrop) ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Blueprint grid overlay */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.09) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ring image — fills upper portion */
    .hero-ring {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 108vw);
      max-width: none;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 48px 96px rgba(7, 22, 48, 0.60));
      z-index: 1;
    }

    /* Logo — top center */
    .hero-logo {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }
    .hero-logo img {
      height: 28px;
      width: auto;
      opacity: 0.92;
    }

    /* Gradient fade under ring */
    .hero-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 280px;
      background: linear-gradient(to bottom, transparent, var(--nd-paper-000));
      z-index: 2;
      pointer-events: none;
    }

    /* Bottom card */
    .hero-card {
      position: relative;
      z-index: 3;
      width: 100%;
      background: var(--nd-paper-000);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: 36px 24px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: var(--shadow-sheet);
    }

    /* Slogan (Cormorant italic) */
    .headline-italic {
      font-family: var(--font-italic);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2rem, 8.5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: 0.01em;
      text-align: center;
      color: var(--nd-ink-800);
      margin-bottom: 6px;
    }

    /* Sub (display, Unbounded) */
    .subline {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(0.625rem, 2.5vw, 0.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: var(--nd-ink-400);
      margin-bottom: 32px;
    }

    /* Buttons */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), opacity 120ms ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    .btn:active { transform: scale(0.97); }

    /* Primary — navy ink */
    .btn-primary {
      background: var(--nd-ink-800);
      color: #fff;
      box-shadow: 0 6px 28px rgba(11, 32, 64, 0.32);
    }
    .btn-primary:hover {
      opacity: 0.88;
      box-shadow: 0 10px 36px rgba(11, 32, 64, 0.44);
    }

    /* Secondary — outline ink */
    .btn-secondary {
      background: transparent;
      color: var(--nd-ink-800);
      border: 1.5px solid rgba(11, 32, 64, 0.22);
    }
    .btn-secondary:hover {
      background: rgba(11, 32, 64, 0.04);
      border-color: rgba(11, 32, 64, 0.4);
    }

    .btn-icon { flex-shrink: 0; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(11, 32, 64, 0.10);
    }
    .divider span {
      font-size: 0.75rem;
      color: var(--nd-ink-400);
    }

    /* Footer note — JetBrains Mono caps */
    .footer-note {
      margin-top: 28px;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--nd-ink-200);
      text-align: center;
    }

    /* ── Desktop adaptive ── */
    @media (min-width: 480px) {
      .hero-ring { width: min(560px, 90vw); }
      .hero-card {
        max-width: 460px;
        margin: 0 auto;
        border-radius: var(--radius-sheet);
        margin-bottom: 40px;
      }
      .hero { justify-content: center; }
    }

    @media (min-width: 768px) {
      .hero { min-height: 100vh; padding: 0 20px; }
      .hero-ring { width: 540px; top: -40px; }
      .hero-card {
        max-width: 420px;
        padding: 40px 36px 56px;
        box-shadow: 0 20px 80px -12px rgba(7,22,48,.36);
      }
      .hero-fade { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Blueprint grid via ::before -->
    <!-- Logo on dark studio background -->
    <div class="hero-logo">
      <img src="assets/logo/neo-diamond-white.png" alt="Neo Diamond" />
    </div>

    <!-- Ring hero -->
    <img
      class="hero-ring"
      src="assets/renders/ring-white-pink-hero.png"
      alt="Neo Diamond кольцо"
    />

    <!-- Fade gradient under ring -->
    <div class="hero-fade"></div>

    <!-- Card -->
    <div class="hero-card">
      <h1 class="headline-italic">Ваш вкус —<br>ваш смысл</h1>
      <p class="subline">Ювелирная студия · Алматы</p>

      <div class="btn-group">
        <a class="btn btn-primary" href="https://con.neodiamond.kz">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Создать на конструкторе
        </a>

        <div class="divider"><span>или</span></div>

        <a

          target="_blank"
          rel="noopener"
        >
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Отправить свой дизайн
        </a>
      </div>

      <p class="footer-note">Украшения на заказ · Алматы</p>
    </div>
  </div>
</body>
</html>
