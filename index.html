<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo Diamond — Ювелирная студия</title>
  <meta name="description" content="Создайте украшение мечты в онлайн-конструкторе или отправьте свой дизайн. Алматы." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nd-ink-900: #071630;
      --nd-ink-800: #0B2040;
      --nd-ink-600: #1E3149;
      --nd-ink-400: #5B81A1;
      --nd-ink-200: #c2d1de;
      --nd-paper-000: #ffffff;
      --nd-paper-050: #FAFBFC;
      --nd-studio: radial-gradient(120% 90% at 50% 0%, #6A8EAC 0%, #40648A 45%, #1E3149 100%);
      --radius-sheet: 44px;
      --radius-pill: 999px;
      --shadow-sheet: 0 -8px 60px -12px rgba(7,22,48,.28);
      --font-display: 'Unbounded', system-ui, sans-serif;
      --font-body: 'Manrope', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-italic: 'Cormorant Garamond', 'Georgia', serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background: var(--nd-studio);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Blueprint grid */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.09) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .hero-ring {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 108vw);
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 48px 96px rgba(7, 22, 48, 0.60));
      z-index: 1;
      transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
    }

    .hero-logo {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }
    .hero-logo img { height: 28px; width: auto; opacity: 0.92; }

    .hero-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 280px;
      background: linear-gradient(to bottom, transparent, var(--nd-paper-000));
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* ── Card (bottom sheet) ── */
    .hero-card {
      position: relative;
      z-index: 3;
      width: 100%;
      background: var(--nd-paper-000);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      box-shadow: var(--shadow-sheet);
      overflow: hidden;
    }

    /* Two inner panels — hero content and form */
    .card-hero, .card-form {
      padding: 36px 24px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      transition: opacity 0.3s var(--ease-out), transform 0.35s var(--ease-out);
    }
    .card-form {
      display: none;
      align-items: stretch;
    }

    /* ── State: form visible ── */
    body.show-form .card-hero  { display: none; }
    body.show-form .card-form  { display: flex; }
    body.show-form .hero-ring  { opacity: 0.25; transform: translateX(-50%) scale(0.92) translateY(-30px); }
    body.show-form .hero-fade  { opacity: 0; }

    /* ── Hero content ── */
    .headline-italic {
      font-family: var(--font-italic);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2rem, 8.5vw, 2.75rem);
      line-height: 1.1;
      text-align: center;
      color: var(--nd-ink-800);
      margin-bottom: 6px;
    }
    .subline {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(0.625rem, 2.5vw, 0.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: var(--nd-ink-400);
      margin-bottom: 32px;
    }
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 180ms var(--ease-out), opacity 120ms ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--nd-ink-800);
      color: #fff;
      box-shadow: 0 6px 28px rgba(11, 32, 64, 0.32);
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      background: transparent;
      color: var(--nd-ink-800);
      border: 1.5px solid rgba(11, 32, 64, 0.22);
    }
    .btn-secondary:hover { background: rgba(11, 32, 64, 0.04); border-color: rgba(11, 32, 64, 0.4); }
    .divider {
      display: flex; align-items: center; gap: 12px; width: 100%;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(11, 32, 64, 0.10);
    }
    .divider span { font-size: 0.75rem; color: var(--nd-ink-400); }
    .footer-note {
      margin-top: 28px;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--nd-ink-200);
      text-align: center;
    }

    /* ── Form content ── */
    .form-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--nd-ink-400);
      font-family: var(--font-body);
      font-size: 0.875rem;
      padding: 0;
      margin-bottom: 28px;
      -webkit-tap-highlight-color: transparent;
      align-self: flex-start;
    }
    .form-back:hover { color: var(--nd-ink-800); }

    .form-title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(1.5rem, 6vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--nd-ink-800);
      margin-bottom: 6px;
    }
    .form-sub {
      font-size: 0.875rem;
      color: var(--nd-ink-400);
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .form-input {
      width: 100%;
      padding: 15px 18px;
      border: 1.5px solid rgba(11,32,64,0.16);
      border-radius: 16px;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--nd-ink-800);
      background: var(--nd-paper-050);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--nd-ink-800); background: #fff; }
    .form-input::placeholder { color: var(--nd-ink-200); }

    .form-phone-row {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid rgba(11,32,64,0.16);
      border-radius: 16px;
      background: var(--nd-paper-050);
      transition: border-color 0.2s;
      overflow: hidden;
    }
    .form-phone-row:focus-within { border-color: var(--nd-ink-800); background: #fff; }
    .form-dial {
      padding: 15px 0 15px 18px;
      font-size: 16px;
      font-family: var(--font-body);
      color: var(--nd-ink-400);
      flex-shrink: 0;
    }
    .form-phone-input {
      flex: 1;
      padding: 15px 18px 15px 6px;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--nd-ink-800);
      outline: none;
      -webkit-appearance: none;
    }
    .form-phone-input::placeholder { color: var(--nd-ink-200); }

    .form-timing-label {
      font-family: var(--font-display);
      font-size: 0.625rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--nd-ink-400);
      margin-top: 4px;
    }
    .form-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .form-pill {
      padding: 11px 18px;
      border-radius: var(--radius-pill);
      border: 1.5px solid rgba(11,32,64,0.16);
      background: transparent;
      color: var(--nd-ink-400);
      font-family: var(--font-body);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .form-pill:hover { background: rgba(11,32,64,0.04); border-color: rgba(11,32,64,0.3); }
    .form-pill:active { transform: scale(0.97); }
    .form-pill.is-active {
      background: var(--nd-ink-800);
      border-color: var(--nd-ink-800);
      color: #fff;
      font-weight: 600;
    }

    .form-error {
      font-size: 0.8125rem;
      color: #A64155;
      padding: 10px 14px;
      background: rgba(166,65,85,0.08);
      border-radius: 10px;
      display: none;
    }
    .form-error.visible { display: block; }

    .form-submit {
      width: 100%;
      padding: 18px 24px;
      margin-top: 8px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--nd-ink-800);
      color: #fff;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }
    .form-submit:hover { opacity: 0.88; }
    .form-submit:active { transform: scale(0.97); }
    .form-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Desktop ── */
    @media (min-width: 480px) {
      .hero-ring { width: min(560px, 90vw); }
      .hero-card { max-width: 460px; margin: 0 auto; border-radius: var(--radius-sheet); margin-bottom: 40px; }
      .hero { justify-content: center; }
    }
    @media (min-width: 768px) {
      .hero { min-height: 100vh; padding: 0 20px; }
      .hero-ring { width: 540px; top: -40px; }
      .hero-card { max-width: 420px; box-shadow: 0 20px 80px -12px rgba(7,22,48,.36); }
      .hero-fade { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-logo">
      <img src="assets/logo/neo-diamond-white.png" alt="Neo Diamond" />
    </div>

    <img class="hero-ring" src="assets/renders/ring-white-pink-hero.png" alt="Neo Diamond кольцо" />
    <div class="hero-fade"></div>

    <div class="hero-card">

      <!-- State 1: Hero -->
      <div class="card-hero">
        <h1 class="headline-italic">Ваш вкус —<br>ваш смысл</h1>
        <p class="subline">Ювелирная студия · Алматы</p>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="showLeadForm()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            Создать на конструкторе
          </button>
          <div class="divider"><span>или</span></div>
          <a class="btn btn-secondary"
            href="https://wa.me/77766708505?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C+%D1%85%D0%BE%D1%87%D1%83+%D0%BE%D1%82%D0%BF%D1%80%D0%B0%D0%B2%D0%B8%D1%82%D1%8C+%D1%81%D0%B2%D0%BE%D0%B9+%D0%B4%D0%B8%D0%B7%D0%B0%D0%B9%D0%BD+%E2%80%94+%D0%BF%D0%BE%D1%81%D1%87%D0%B8%D1%82%D0%B0%D0%B9%D1%82%D0%B5+%D0%BF%D0%BE%D0%B6%D0%B0%D0%BB%D1%83%D0%B9%D1%81%D1%82%D0%B0+%D1%81%D1%82%D0%BE%D0%B8%D0%BC%D0%BE%D1%81%D1%82%D1%8C"
            target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            Отправить свой дизайн
          </a>
        </div>
        <p class="footer-note">Украшения на заказ · Алматы</p>
      </div>

      <!-- State 2: Lead form -->
      <div class="card-form" id="leadForm">
        <button class="form-back" onclick="hideLeadForm()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Назад
        </button>

        <h2 class="form-title">Давайте<br>познакомимся</h2>
        <p class="form-sub">Это займёт 10 секунд — а конструктор покажет живую цену украшения</p>

        <div class="form-fields">
          <input id="fname" class="form-input" type="text" placeholder="Ваше имя" autocomplete="given-name" />

          <div class="form-phone-row">
            <span class="form-dial">+7</span>
            <input id="fphone" class="form-phone-input" type="tel" inputmode="numeric" placeholder="777 123 45 67" autocomplete="tel-national" />
          </div>

          <div class="form-timing-label">Когда нужно украшение?</div>
          <div class="form-pills">
            <button class="form-pill" onclick="selectTiming(this, 'В течение недели')">В течение недели</button>
            <button class="form-pill" onclick="selectTiming(this, 'В течение месяца')">В течение месяца</button>
            <button class="form-pill" onclick="selectTiming(this, 'Пока присматриваюсь')">Пока присматриваюсь</button>
          </div>

          <div id="formError" class="form-error"></div>

          <button id="submitBtn" class="form-submit" onclick="submitLead()">Открыть конструктор →</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    var selectedTiming = null;

    function showLeadForm() {
      document.body.classList.add('show-form');
      setTimeout(function() {
        document.getElementById('fname').focus();
      }, 350);
    }

    function hideLeadForm() {
      document.body.classList.remove('show-form');
      selectedTiming = null;
      document.querySelectorAll('.form-pill').forEach(function(p) { p.classList.remove('is-active'); });
      document.getElementById('formError').classList.remove('visible');
    }

    function selectTiming(el, value) {
      selectedTiming = value;
      document.querySelectorAll('.form-pill').forEach(function(p) { p.classList.remove('is-active'); });
      el.classList.add('is-active');
    }

    function submitLead() {
      var name  = document.getElementById('fname').value.trim();
      var phone = document.getElementById('fphone').value.replace(/\D/g, '');
      var errEl = document.getElementById('formError');
      var btn   = document.getElementById('submitBtn');

      errEl.classList.remove('visible');

      if (name.length < 2) {
        errEl.textContent = 'Пожалуйста, укажите ваше имя';
        errEl.classList.add('visible');
        document.getElementById('fname').focus();
        return;
      }
      if (phone.length < 7) {
        errEl.textContent = 'Пожалуйста, укажите номер телефона';
        errEl.classList.add('visible');
        document.getElementById('fphone').focus();
        return;
      }
      if (!selectedTiming) {
        errEl.textContent = 'Выберите, когда нужно украшение';
        errEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Открываем...';

      var fullPhone = '+7' + (phone.startsWith('7') ? phone.slice(1) : phone.startsWith('8') ? phone.slice(1) : phone);

      // Map timing labels to amoCRM values
      var timingMap = {
        'В течение недели': 'До 5-дней',
        'В течение месяца': 'В течений месяца',
        'Пока присматриваюсь': 'Больше месяца'
      };

      // Fire-and-forget to configurator's API (CORS allowed)
      fetch('https://con.neodiamond.kz/api/submit-lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: fullPhone,
          timing: timingMap[selectedTiming] || selectedTiming,
          preCapture: true
        })
      }).catch(function() {});

      // Redirect immediately (don't wait for API)
      setTimeout(function() {
        window.location.href = 'https://con.neodiamond.kz';
      }, 400);
    }
  </script>
</body>
</html>
