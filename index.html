<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo Diamond — Ювелирная студия</title>
  <meta name="description" content="Создайте украшение мечты в онлайн-конструкторе или отправьте свой дизайн" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nd-ink-900: #071630;
      --nd-ink-800: #0B2040;
      --nd-ink-600: #1E3149;
      --nd-ink-400: #5B81A1;
      --nd-ink-200: #c2d1de;
      --nd-rose-600: #C2657A;
      --nd-rose-500: #E68FA5;
      --nd-rose-400: #F0A9B8;
      --nd-rose-200: #F8D4DC;
      --nd-paper-000: #ffffff;
      --nd-paper-050: #f7f5f3;
      --nd-studio: radial-gradient(120% 90% at 50% 0%, #6A8EAC 0%, #40648A 45%, #1E3149 100%);
      --text-inverse: #f7f5f3;
      --font-display: 'Jost', 'Century Gothic', system-ui, sans-serif;
      --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background: var(--nd-studio);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      min-height: 100dvh;
      padding-bottom: 0;
      overflow: hidden;
    }

    /* Ring image — fills upper portion */
    .hero-ring {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 105vw);
      max-width: none;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 40px 80px rgba(7, 22, 48, 0.55));
    }

    /* Bottom card */
    .hero-card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: var(--nd-paper-000);
      border-radius: 28px 28px 0 0;
      padding: 32px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 -8px 40px rgba(7, 22, 48, 0.25);
    }

    .logo {
      width: 130px;
      margin-bottom: 20px;
    }

    .headline {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--nd-ink-800);
      margin-bottom: 10px;
    }

    .subline {
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.6;
      color: var(--nd-ink-400);
      text-align: center;
      margin-bottom: 32px;
      max-width: 300px;
    }

    /* Buttons */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 24px;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out), background 150ms ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    .btn:active { transform: scale(0.97); }

    /* Primary — rose */
    .btn-primary {
      background: var(--nd-rose-600);
      color: #fff;
      box-shadow: 0 4px 20px rgba(194, 101, 122, 0.38);
    }

    .btn-primary:hover {
      background: var(--nd-rose-500);
      box-shadow: 0 6px 28px rgba(194, 101, 122, 0.5);
    }

    /* Secondary — ink outline */
    .btn-secondary {
      background: transparent;
      color: var(--nd-ink-800);
      border: 1.5px solid rgba(11, 32, 64, 0.22);
    }

    .btn-secondary:hover {
      background: rgba(11, 32, 64, 0.04);
      border-color: rgba(11, 32, 64, 0.38);
    }

    .btn-icon { flex-shrink: 0; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(11, 32, 64, 0.1);
    }

    .divider span {
      font-size: 0.75rem;
      color: var(--nd-ink-400);
      font-family: var(--font-sans);
    }

    /* Footer note */
    .footer-note {
      margin-top: 24px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--nd-ink-200);
      text-align: center;
      font-family: var(--font-sans);
    }

    /* Gradient fade over ring bottom */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 260px;
      background: linear-gradient(to bottom, transparent, var(--nd-paper-000));
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img
      class="hero-ring"
      src="assets/renders/ring-white-pink-hero.png"
      alt="Neo Diamond кольцо"
    />

    <div class="hero-card">
      <img class="logo" src="assets/logo/neo-diamond-ink.png" alt="Neo Diamond" />

      <h1 class="headline">Ваш вкус —<br>ваш смысл</h1>
      <p class="subline">Ювелирная студия формата конструктор. Алматы.</p>

      <div class="btn-group">

            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>

          target="_blank"

          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Отправить свой дизайн
        </a>
      </div>

      <p class="footer-note">Алматы · Украшения на заказ</p>
    </div>
  </div>
</body>
</html>
